<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 800" width="1880" height="1600">
  <title>An imagined depiction of a 12th-century scholar reading by lamplight (artistic, not a portrait)</title>
  <defs>
    <radialGradient id="glow" cx="830" cy="640" r="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5c76a" stop-opacity=".55"/>
      <stop offset=".25" stop-color="#d5a447" stop-opacity=".22"/>
      <stop offset=".6" stop-color="#173540" stop-opacity=".0"/>
    </radialGradient>
    <radialGradient id="flame" cx="0" cy="0" r="1">
      <stop offset="0" stop-color="#fff4d6"/>
      <stop offset=".4" stop-color="#f5c76a"/>
      <stop offset="1" stop-color="#d5a447" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="robe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#071317"/>
      <stop offset=".7" stop-color="#0c1f25"/>
      <stop offset="1" stop-color="#2a3a33"/>
    </linearGradient>
    <linearGradient id="turban" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4644"/>
      <stop offset=".6" stop-color="#8d8a78"/>
      <stop offset="1" stop-color="#e9dcb8"/>
    </linearGradient>
    <pattern id="lattice" width="60" height="60" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#d5a447" stroke-width="1.2">
        <rect x="16" y="16" width="28" height="28"/>
        <rect x="16" y="16" width="28" height="28" transform="rotate(45 30 30)"/>
        <path d="M0 30h10M50 30h10M30 0v10M30 50v10"/>
      </g>
    </pattern>
    <pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <path d="M0 0v7" stroke="#d5a447" stroke-width=".8" stroke-opacity=".35"/>
    </pattern>
    <clipPath id="arch"><path d="M250 760V300c0-120 85-200 175-235 90 35 175 115 175 235v460z"/></clipPath>
  </defs>

  <!-- arched lattice window behind -->
  <g clip-path="url(#arch)" opacity=".42">
    <rect x="240" y="40" width="380" height="740" fill="#0f2a31"/>
    <rect x="240" y="40" width="380" height="740" fill="url(#lattice)"/>
  </g>
  <path d="M250 760V300c0-120 85-200 175-235 90 35 175 115 175 235v460" fill="none" stroke="#d5a447" stroke-opacity=".55" stroke-width="2"/>
  <path d="M232 760V296c0-132 95-218 193-256 98 38 193 124 193 256v464" fill="none" stroke="#d5a447" stroke-opacity=".25" stroke-width="1.2"/>

  <!-- lamp glow -->
  <rect width="940" height="800" fill="url(#glow)"/>

  <!-- floor line -->
  <path d="M120 762H930" stroke="#d5a447" stroke-opacity=".35" stroke-width="1.5"/>

  <!-- seated figure (robe) -->
  <path d="M372 762
           C368 700 382 640 410 588
           C436 540 452 500 470 470
           C484 446 500 432 522 424
           L556 420
           C590 424 612 440 626 470
           C640 500 650 532 660 560
           C676 600 700 640 742 672
           C772 696 786 726 790 762 Z" fill="url(#robe)"/>
  <path d="M372 762 C368 700 382 640 410 588 C436 540 452 500 470 470 C484 446 500 432 522 424 L556 420 C590 424 612 440 626 470 C640 500 650 532 660 560 C676 600 700 640 742 672 C772 696 786 726 790 762 Z" fill="url(#hatch)" opacity=".55"/>
  <!-- robe folds -->
  <g fill="none" stroke="#d5a447" stroke-linecap="round">
    <path d="M626 470 C640 520 660 590 700 650 C720 680 744 712 754 760" stroke-opacity=".75" stroke-width="2"/>
    <path d="M560 470 C566 540 584 610 612 680" stroke-opacity=".3" stroke-width="1.2"/>
    <path d="M500 520 C498 590 506 670 520 760" stroke-opacity=".22" stroke-width="1.2"/>
    <path d="M440 600 C470 640 520 690 600 724" stroke-opacity=".22" stroke-width="1.2"/>
    <path d="M470 700 C540 716 640 730 760 740" stroke-opacity=".3" stroke-width="1.2"/>
  </g>

  <!-- forearm reaching to the book -->
  <path d="M600 520 C630 540 660 552 700 556 L712 566 C680 574 640 572 606 560 Z" fill="#10252b"/>
  <path d="M600 520 C630 540 660 552 700 556" fill="none" stroke="#f5c76a" stroke-opacity=".8" stroke-width="2"/>
  <path d="M702 552 c8 0 14 4 14 9 c0 5 -7 8 -14 7" fill="#c7a77a"/>

  <!-- neck + head in profile, facing the lamp -->
  <path d="M540 430 C540 410 548 398 560 392 L588 392 C590 404 590 418 586 430 Z" fill="#b8956c"/>
  <path d="M528 362
           C528 334 546 318 572 318
           C596 318 610 332 612 350
           L616 362 L624 374 L616 378 L618 388
           C616 396 608 400 600 400
           C598 412 592 422 580 428
           C566 434 548 432 538 420
           C530 408 528 386 528 362 Z" fill="#c9a679"/>
  <!-- shading on face, lamp side bright -->
  <path d="M600 340 L612 350 L616 362 L624 374 L616 378 L618 388 C616 396 608 400 600 400" fill="none" stroke="#fff1d0" stroke-width="2" stroke-opacity=".9"/>
  <path d="M528 362 C528 386 530 408 538 420 C548 432 566 434 580 428" fill="none" stroke="#5d4630" stroke-width="3" stroke-opacity=".5"/>
  <!-- eye, lowered toward the book -->
  <path d="M590 356 q7 4 13 1" fill="none" stroke="#2a1c12" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M586 348 q9 -4 18 -1" fill="none" stroke="#3a2a1a" stroke-width="2.6" stroke-linecap="round"/>
  <!-- beard -->
  <path d="M600 392
           C604 410 602 432 592 452
           C582 470 562 476 546 468
           C536 456 532 436 534 414
           C548 426 568 428 584 418
           C592 412 596 402 600 392 Z" fill="#1d1712"/>
  <path d="M600 392 C604 410 602 432 592 452 C584 466 572 472 560 472" fill="none" stroke="#d5a447" stroke-opacity=".7" stroke-width="1.6"/>
  <g stroke="#6b5233" stroke-opacity=".6" stroke-width="1" fill="none">
    <path d="M552 440 q6 14 4 26"/><path d="M566 436 q6 14 2 30"/><path d="M580 430 q6 12 2 28"/>
  </g>

  <!-- turban -->
  <path d="M520 352
           C506 316 516 272 552 254
           C586 238 624 250 640 282
           C650 304 646 330 628 346
           C600 336 560 336 520 352 Z" fill="url(#turban)"/>
  <g fill="none" stroke="#5b5747" stroke-opacity=".55" stroke-width="1.4">
    <path d="M524 330 C560 300 606 292 640 300"/>
    <path d="M520 310 C552 280 598 270 634 278"/>
    <path d="M528 288 C556 262 590 254 620 260"/>
    <path d="M536 344 C566 326 606 322 632 330"/>
  </g>
  <path d="M552 254 C586 238 624 250 640 282 C650 304 646 330 628 346" fill="none" stroke="#fff4dc" stroke-opacity=".85" stroke-width="2"/>
  <path d="M520 352 C540 370 538 404 532 430" fill="none" stroke="#e9dcb8" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>

  <!-- reading stand (rahle) and open manuscript -->
  <g stroke="#d5a447" stroke-width="5" stroke-linecap="round">
    <path d="M708 600 L782 700" stroke-opacity=".9"/>
    <path d="M782 600 L708 700" stroke-opacity=".7"/>
  </g>
  <path d="M676 590 C700 574 728 572 746 586 C764 572 792 574 816 590 L812 600 C792 590 766 590 746 600 C726 590 700 590 680 600 Z" fill="#efe2c2"/>
  <path d="M746 586 V600" stroke="#8a6a35" stroke-width="1.5"/>
  <g stroke="#8a6a35" stroke-width="1" stroke-opacity=".55">
    <path d="M690 588 q24 -9 48 -2"/><path d="M692 593 q22 -8 46 -2"/><path d="M756 586 q24 -7 48 2"/><path d="M756 591 q22 -6 46 2"/>
  </g>
  <path d="M676 590 C700 574 728 572 746 586 C764 572 792 574 816 590" fill="none" stroke="#fff4dc" stroke-width="1.6"/>

  <!-- oil lamp -->
  <g transform="translate(852 700)">
    <ellipse cx="0" cy="62" rx="26" ry="6" fill="#d5a447" fill-opacity=".25"/>
    <path d="M-30 30 C-30 10 30 10 34 24 L48 18 L44 30 C40 44 -24 48 -30 30 Z" fill="#b8862e"/>
    <path d="M-30 30 C-30 10 30 10 34 24" fill="none" stroke="#fff1c8" stroke-width="1.6"/>
    <path d="M-6 44 L-10 62 H14 L10 44 Z" fill="#8a6a35"/>
    <circle cx="46" cy="0" r="38" fill="url(#flame)" opacity=".55"/>
    <path d="M46 -14 C54 -2 54 10 46 16 C38 10 38 -2 46 -14 Z" fill="#fff4d6"/>
  </g>

  <!-- dust motes in the light -->
  <g fill="#f5c76a">
    <circle cx="700" cy="430" r="1.6" opacity=".6"/><circle cx="742" cy="480" r="1.2" opacity=".5"/>
    <circle cx="660" cy="400" r="1" opacity=".5"/><circle cx="790" cy="520" r="1.4" opacity=".6"/>
    <circle cx="720" cy="360" r="1" opacity=".4"/><circle cx="820" cy="450" r="1.2" opacity=".45"/>
  </g>
</svg>
